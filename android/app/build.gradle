plugins {
    id "com.android.application"
}

android {
    namespace "forge.seal"
    compileSdk 35

    defaultConfig {
        applicationId "forge.seal.game"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ["../../mobile/www"]
        }
    }

    lint {
        abortOnError false
    }
}
