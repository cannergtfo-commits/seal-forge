name: Package Seal Forge

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Migrate check
        run: npm run db:migrate
      - name: Zip installable source
        run: |
          mkdir -p dist-package
          git archive --format=zip --output "dist-package/seal-forge-${GITHUB_REF_NAME}.zip" HEAD
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-package/*.zip
          generate_release_notes: true
